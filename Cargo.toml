[workspace]
resolver = "2"
# The Bevy viewer is its own workspace (see viewer/Cargo.toml).
exclude = ["viewer"]
members = ["crates/engine", "crates/host", "crates/esm", "crates/bsa", "crates/nif", "crates/dds", "crates/assets", "crates/world", "crates/preview", "crates/cellview", "crates/testdata", "crates/shaders", "crates/nvinspect", "crates/physics", "crates/script", "crates/scriptgen", "crates/mp3", "crates/bink", "crates/ui", "crates/speedtree", "crates/fos"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
