<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="nv-rs logo">
  <title>nv-rs</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d10"/>
      <stop offset="0.55" stop-color="#7a3f17"/>
      <stop offset="1" stop-color="#d9772b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f29a2e"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="240" r="150"/></clipPath>
    <clipPath id="sunhalf"><rect x="0" y="0" width="512" height="262"/></clipPath>
    <clipPath id="sunclip"><circle cx="256" cy="250" r="90"/></clipPath>
  </defs>

  <!-- Gear -->
  <g fill="#f2c14e">
    <circle cx="256" cy="240" r="186"/>
    <g id="tooth"><rect x="236" y="30" width="40" height="44" rx="6"/></g>
    <use href="#tooth" transform="rotate(30 256 240)"/>
    <use href="#tooth" transform="rotate(60 256 240)"/>
    <use href="#tooth" transform="rotate(90 256 240)"/>
    <use href="#tooth" transform="rotate(120 256 240)"/>
    <use href="#tooth" transform="rotate(150 256 240)"/>
    <use href="#tooth" transform="rotate(180 256 240)"/>
    <use href="#tooth" transform="rotate(210 256 240)"/>
    <use href="#tooth" transform="rotate(240 256 240)"/>
    <use href="#tooth" transform="rotate(270 256 240)"/>
    <use href="#tooth" transform="rotate(300 256 240)"/>
    <use href="#tooth" transform="rotate(330 256 240)"/>
  </g>
  <circle cx="256" cy="240" r="164" fill="#14110b"/>

  <!-- Mojave sunset inside the gear -->
  <g clip-path="url(#disc)">
    <rect x="96" y="80" width="320" height="320" fill="url(#sky)"/>
    <g clip-path="url(#sunhalf)">
      <circle cx="256" cy="250" r="90" fill="url(#sun)"/>
    </g>
    <!-- retro bands across the sun -->
    <g fill="#7a3f17" clip-path="url(#sunclip)">
      <rect x="160" y="218" width="192" height="5"/>
      <rect x="160" y="234" width="192" height="7"/>
      <rect x="160" y="250" width="192" height="9"/>
    </g>
    <!-- mountains -->
    <path d="M96 296 L150 258 L190 280 L232 250 L282 282 L326 254 L372 288 L416 268 L416 400 L96 400 Z" fill="#3b2614"/>
    <path d="M96 316 L170 280 L228 304 L290 274 L352 300 L416 284 L416 400 L96 400 Z" fill="#241709"/>
    <!-- road to the horizon -->
    <path d="M244 316 L268 316 L330 400 L182 400 Z" fill="#14110b"/>
    <path d="M254 330 L258 330 L260 346 L252 346 Z M251 360 L261 360 L264 384 L248 384 Z" fill="#f2c14e"/>
  </g>
  <circle cx="256" cy="240" r="150" fill="none" stroke="#f2c14e" stroke-width="4"/>

  <!-- Wordmark plate -->
  <rect x="116" y="388" width="280" height="80" rx="12" fill="#14110b" stroke="#f2c14e" stroke-width="5"/>
  <text x="256" y="446" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" font-size="54" letter-spacing="6" fill="#f2c14e">NV·RS</text>
</svg>
